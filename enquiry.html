<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved - Seeds of Kindness</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Seeds of Kindness</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Our Impact</a></li>
                <li><a href="enquiry.html">Get Involved</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Get Involved - Donate or Volunteer</h2>
        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="type">I want to:</label>
            <select id="type" name="type">
                <option value="donate">Donate Food/Money</option>
                <option value="volunteer">Volunteer Time</option>
                <option value="partner">Partner as Business</option>
            </select>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4"></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Seeds of Kindness | Johannesburg</p>
    </footer>
</body>
</html>
